<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grupo 4 – Netlify Deploy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #00d4aa33;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 640px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 40px #00d4aa22;
    }

    .badge {
      display: inline-block;
      background: #00d4aa18;
      color: #00d4aa;
      border: 1px solid #00d4aa55;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 6px 18px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    h1 span {
      color: #00d4aa;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }

    .info-item {
      background: #0f0f1a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
    }

    .info-item .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .info-item .value {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00d4aa11;
      border: 1px solid #00d4aa44;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      color: #00d4aa;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #00d4aa;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Parcial 03 · EID1030</div>
    <h1>Deploy en <span>Netlify</span></h1>
    <p class="subtitle">
      Aplicación desplegada como parte de la investigación comparativa de plataformas cloud.
    </p>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Plataforma</div>
        <div class="value">Netlify</div>
      </div>
      <div class="info-item">
        <div class="label">Grupo</div>
        <div class="value">Grupo 4</div>
      </div>
      <div class="info-item">
        <div class="label">Curso</div>
        <div class="value">EID1030</div>
      </div>
      <div class="info-item">
        <div class="label">Tipo</div>
        <div class="value">Frontend Deploy</div>
      </div>
    </div>

    <div class="status">
      <div class="dot"></div>
      Aplicación activa y accesible
    </div>

    <div class="footer">Desplegado con Netlify · Integración continua desde GitHub</div>
  </div>
</body>
</html>
